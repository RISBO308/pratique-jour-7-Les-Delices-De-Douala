<article class="restaurant-card">
  <div class="restaurant-image-container">
    <img class="restaurant-image" [src]="restaurant().image" [alt]="restaurant().name" loading="lazy" />
    <span class="restaurant-district-badge">{{ restaurant().district }}</span>
  </div>

  <div class="restaurant-content">
    <div class="restaurant-main">
      <h3 class="restaurant-name">{{ restaurant().name }}</h3>
      <span class="restaurant-specialty">{{ restaurant().specialty }}</span>
    </div>

    <div class="restaurant-footer">
      <app-star-rating
        [currentRating]="restaurant().currentRating"
        (ratingChanged)="onRatingChanged($event)"
      ></app-star-rating>
    </div>
  </div>
</article>
