<button
  type="button"
  class="top-rated-toggle"
  [class.active]="showOnlyTopRated()"
  (click)="toggleTopRatedFilter()"
>
  {{ showOnlyTopRated() ? 'Afficher tous les restaurants' : '★ Filtrer ≥ 4 étoiles' }}
</button>

@if (visibleRestaurants().length === 0) {
  <p class="empty-state">Aucun restaurant noté 4 étoiles ou plus pour l'instant</p>
} @else {
  @for (restaurant of visibleRestaurants(); track restaurant.id) {
    <app-restaurant-card
      [restaurant]="restaurant"
      (restaurantRated)="onRestaurantRated($event)"
    ></app-restaurant-card>
  }
}
